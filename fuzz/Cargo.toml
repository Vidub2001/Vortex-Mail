# Cibles de fuzzing (lot 8 de docs/plan-lots.md) : les lecteurs de ce qui
# arrive de l'extérieur (serveurs IMAP, CalDAV/CardDAV, Outlook.com, Google ;
# messages, invitations, cartes de visite reçus).
#
# Hors de l'espace de travail principal : il faut Rust nightly et cargo-fuzz.
#   cargo +nightly fuzz list
#   scripts/fuzz.sh 60              (toutes les cibles, 60 s chacune)
# Mode d'emploi : fuzz/README.md.
[package]
name = "vortexmail-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
imap-lite = { path = "../crates/imap-lite" }
vortexmail = { path = "../src-tauri" }
vortex-smime = { path = "../crates/smime" }

# Espace de travail à part : pas membre de celui de la racine.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "imap_session"
path = "fuzz_targets/imap_session.rs"
test = false
doc = false
bench = false

