# SonarQube — utilisé par `make sonar`.
# L'adresse du serveur et le jeton ne sont jamais écrits ici : le scanner les
# lit dans les variables d'environnement SONAR_HOST_URL et SONAR_TOKEN.

sonar.projectKey=vortexmail
sonar.projectName=vortexmail
sonar.sourceEncoding=UTF-8

# Frontend TypeScript / React : analysé nativement.
# Rust : la Community Build ne l'analyse pas ; les fichiers sont indexés pour
# recevoir les alertes Clippy importées ci-dessous.
sonar.sources=src,src-tauri/src,src-tauri/build.rs,crates/mail-core/src,crates/imap-lite/src,crates/smime/src
sonar.tests=crates/mail-core/tests,crates/imap-lite/tests,src-tauri/tests,tests/frontend,tests/ui
sonar.exclusions=src/assets/**,src-tauri/gen/**,**/*.json
sonar.typescript.tsconfigPaths=tsconfig.json

# Alertes Clippy converties au format générique (make sonar les régénère).
sonar.externalIssuesReportPaths=target/audit/clippy-sonar.json

# Couverture des tests de l'interface (node --test, make front-coverage), lot J8c.
sonar.javascript.lcov.reportPaths=target/audit/lcov.info
# Composants React et points d'entrée : testés de bout en bout par Playwright
# (tests/ui), qui ne mesure pas la couverture ; node --test couvre la logique
# (calendar.ts, links.ts, rules.ts…). Hors du calcul de couverture seulement :
# leurs alertes restent analysées (lot L2, décision du 18 novembre 2026).
# La maquette de l'aperçu navigateur (mock.ts) n'est pas livrée.
sonar.coverage.exclusions=src/components/**,src/App.tsx,src/Popup.tsx,src/main.tsx,src/mock.ts
