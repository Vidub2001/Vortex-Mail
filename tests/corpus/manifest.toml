# --- Plafonds IMAP (lot 5b) ------------------------------------------------------
# Trouvés le 10 novembre 2026 en comparant imap-lite au client IMAP de MailCraft.
# Tests automatiques : crates/imap-lite/src/reader.rs et response.rs.

[[scenario]]
id = "I1"
lot = "5b"
titre = "Parenthèses imbriquées sans fin dans une réponse IMAP"
etapes = [
  "Le serveur répond « * 1 FETCH (((((… » avec 200 000 parenthèses ouvrantes.",
