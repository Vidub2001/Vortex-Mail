# --- Scénarios de perte de données ------------------------------------------------

[[scenario]]
id = "Y1"
lot = 3
titre = "Brouillon et vrai message avec le même numéro interne"
etapes = [
  "Serveur sans UIDPLUS, recherche par Message-ID sans résultat juste après l'APPEND.",
  "Enregistrer un brouillon : il reçoit un identifiant provisoire N.",
  "Une synchronisation attribue N à un autre message M.",
  "Laisser l'enregistrement automatique remplacer le brouillon.",
]
attendu = "M reste intact sur le serveur ; seul l'ancien brouillon est supprimé."
tests = [
  "src-tauri/src/cache.rs::identifiant_provisoire_jamais_reattribue",
]
etat = "corrige"

[[scenario]]
id = "Y2"
lot = 3
titre = "Déplacement entre comptes interrompu par le réseau"
etapes = [
  "Déplacer un message du compte A vers un dossier du compte B.",
  "La copie dans B réussit, la suppression dans A échoue (réseau).",
  "Rejouer les actions en attente plusieurs fois, A restant instable.",
]
attendu = "Une seule copie dans B ; la source est supprimée dès que A répond."
tests = [
  "crates/mail-core/tests/move_messages.rs::source_not_removed_is_finished_without_a_second_copy",
  "crates/mail-core/tests/move_messages.rs::interrupted_after_copy_only_deletes_the_source",
]
etat = "corrige"

[[scenario]]
id = "Y3"
lot = 3
titre = "Dossier jamais ouvert où l'on a enregistré un brouillon"
etapes = [
  "Ajouter un compte dont le dossier Brouillons contient déjà 40 messages.",
  "Sans ouvrir Brouillons, rédiger un mail (enregistrement automatique).",
  "Ouvrir Brouillons.",
]
attendu = "Les 40 anciens brouillons et le nouveau sont listés."
etat = "corrige"
tests = [
  "src-tauri/src/router.rs::y3_dossier_jamais_synchronise_relu_entierement",
]

[[scenario]]
id = "Y4"
