# Corpus de non-régression de Vortex Mail (lot 0 de docs/plan-lots.md).
#
# [[attaque]]  : un mail piégé (.eml dans attaques/) par attaque de la relecture
#                du 5 novembre 2026, avec le comportement attendu une fois
#                corrigé.
# [[scenario]] : un cas de perte, de duplication ou de disparition de données,
#                décrit pas à pas ; le lot indiqué en fait un test automatique.
#
# etat = "accepte-temporairement" tant que le lot correctif n'est pas livré,
# puis "corrige" quand un test automatique vérifie l'attendu ; une entrée
# "corrige" nomme ce test : tests = ["chemin::fonction"] pour un test Rust,
# ["chemin::titre"] pour un test de l'interface (lot 9b).
# Vérifié par `make corpus` (scripts/audit/corpus_check.py).

